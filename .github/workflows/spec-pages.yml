name: Publish specification book

on:
  push:
    branches: [master]
    paths: ['spec/**', 'docs/**', 'book.toml', 'TODO.md', 'readme.md', '.github/workflows/spec-pages.yml']
  pull_request:
    paths: ['spec/**', 'docs/**', 'book.toml', 'TODO.md', 'readme.md', '.github/workflows/spec-pages.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: spec-pages-${{ github.event_name == 'pull_request' && github.ref || 'production' }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install verified mdBook 0.4.52
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 https://github.com/rust-lang/mdBook/releases/download/v0.4.52/mdbook-v0.4.52-x86_64-unknown-linux-gnu.tar.gz -o "$RUNNER_TEMP/mdbook.tar.gz"
          echo "c0b903f01dd8f4edc644372ad2b80b1fdddd12552d37b6a098657cbd8eddd768  $RUNNER_TEMP/mdbook.tar.gz" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/mdbook-bin"
          tar -xzf "$RUNNER_TEMP/mdbook.tar.gz" -C "$RUNNER_TEMP/mdbook-bin" mdbook
          echo "$RUNNER_TEMP/mdbook-bin" >> "$GITHUB_PATH"
      - name: Check source navigation
        run: python3 spec/tools/check_docs.py
      - name: Build specification
        run: mdbook build
      - name: Check rendered navigation
        run: python3 spec/tools/check_book.py
      - name: Upload specification artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: target/spec-book

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Publish specification
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
