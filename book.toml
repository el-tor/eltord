[book]
title = "El Tor Specifications"
authors = ["Eltor Dev"]
language = "en"
src = "spec"

[build]
build-dir = "target/spec-book"

[output.html]
git-repository-url = "https://github.com/el-tor/eltord"
default-theme = "light"
preferred-dark-theme = "navy"

[preprocessor.local-links]
command = "python3 spec/tools/book_links.py"
renderers = ["html"]
after = ["links"]
